name: kp
description: "Helpdesk Teknisi RSUD dr. Soedarso"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.2

  # Network
  http: ^1.2.2
  connectivity_plus: ^6.1.4
  # Storage
  flutter_secure_storage: ^9.2.2

  # Environment
  flutter_dotenv: ^5.2.1

